<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طيارات البث - موبايل فيو</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(to bottom, #38bdf8, #bae6fd, #e0f2fe);
            animation: skyCycleAtmosphere 120s infinite ease-in-out;
            overscroll-behavior: none;
        }

        @keyframes skyCycleAtmosphere {
            0%   { background: linear-gradient(to bottom, #38bdf8, #bae6fd, #e0f2fe); }
            25%  { background: linear-gradient(to bottom, #f97316, #fdba74, #fed7aa); }
            50%  { background: linear-gradient(to bottom, #020617, #090d16, #1e1b4b); }
            75%  { background: linear-gradient(to bottom, #fb923c, #f43f5e, #fda4af); }
            100% { background: linear-gradient(to bottom, #38bdf8, #bae6fd, #e0f2fe); }
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 82vh; 
            overflow: hidden;
        }

        .screen-container.shake {
            animation: screenShake 0.4s ease-in-out;
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-5px, 4px) rotate(-0.5deg); }
            40% { transform: translate(5px, -4px) rotate(0.5deg); }
            60% { transform: translate(-3px, -2px) rotate(-0.3deg); }
            80% { transform: translate(3px, 2px) rotate(0.3deg); }
        }

        .sky-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkleStar 2s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes twinkleStar {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 0.9; transform: scale(1.2); }
        }

        .giant-moon {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, #fffdf0, #fef08a);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(254, 240, 138, 0.6);
            z-index: 2;
            opacity: 0;
            transition: opacity 8s ease;
            pointer-events: none;
        }

        .giant-moon.visible {
            opacity: 0.85;
        }

        .mountains-background, .city-skyline, .ground-terrain {
            position: absolute;
            left: 0;
            width: 200%;
        }

        .mountains-background {
            bottom: 18%;
            height: 18%;
            background: linear-gradient(to top, rgba(51, 65, 85, 0.8), transparent);
            clip-path: polygon(0% 100%, 5% 70%, 12% 85%, 22% 40%, 30% 90%, 42% 50%, 50% 80%, 60% 30%, 72% 85%, 82% 45%, 92% 75%, 100% 35%, 100% 100%);
            z-index: 3;
            animation: scrollMountains 18s linear infinite;
        }

        .city-skyline {
            bottom: 18%;
            height: 12%;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(15, 23, 42, 0.2) 15px, rgba(15, 23, 42, 0.2) 35px);
            z-index: 4;
            animation: scrollCity 12s linear infinite;
            opacity: 0.4;
        }

        .ground-terrain {
            bottom: 0;
            height: 18%;
            background: linear-gradient(to top, #0284c7, #38bdf8, #7dd3fc);
            border-top: 3px solid #bae6fd;
            z-index: 5;
            animation: scrollLand 6s linear infinite;
        }

        @keyframes scrollMountains { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes scrollCity { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes scrollLand { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .planes-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 82%;
            z-index: 10;
            pointer-events: none;
        }

        .side-plane {
            position: absolute;
            width: 100px;
            height: 55px;
            pointer-events: auto;
            transition: filter 0.3s ease, left 0.3s ease-out, top 0.2s ease-out;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }

        .side-plane.boost-glow {
            filter: drop-shadow(0 0 5px #fbbf24) brightness(1.1);
        }

        .side-plane.shaking-plane {
            animation: planeHitShake 0.3s ease-in-out;
        }
        @keyframes planeHitShake { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(-3px, 2px) rotate(-5deg); } 75% { transform: translate(3px, -2px) rotate(5deg); } }

        .side-plane.crashing {
            animation: crashFall 0.8s ease-in forwards;
        }
        @keyframes crashFall { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(150px) rotate(-45deg); opacity: 0; } }

        .falling-gift {
            position: absolute;
            font-size: 18px;
            z-index: 100;
            pointer-events: none;
            animation: dropFromTopFast 0.45s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }
        @keyframes dropFromTopFast { 0% { transform: translateY(-40px) scale(0.2); opacity: 0; } 100% { transform: translateY(var(--target-y)) scale(1); opacity: 1; } }

        .plane-body-svg { width: 100%; height: 100%; }
        .plane-name-tag {
            position: absolute; top: 42%; right: 32%;
            color: #1e293b; font-weight: 800; font-size: 9px;
            text-shadow: 0 1px 1px rgba(255,255,255,0.7);
        }
        .plane-flag-container {
            position: absolute; top: 42%; left: 15%;
            width: 20px; height: 13px; border-radius: 2px;
            overflow: hidden; background: #fff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
        }
        .plane-flag-container img { width: 100%; height: 100%; object-fit: cover; }

        .control-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 18vh;
            background: rgba(15, 23, 42, 0.98);
            border-top: 1px solid #3b82f6;
            display: flex;
            flex-direction: column;
            padding: 2px 4px;
            gap: 2px;
            z-index: 400;
            box-shadow: 0 -3px 8px rgba(0,0,0,0.5);
        }

        .planes-mini-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            padding: 1px 2px;
            width: 100%;
            height: 26px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 3px;
            flex-wrap: nowrap;
        }

        .plane-mini-box {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 3px;
            padding: 1px 5px;
            display: flex;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            flex: 0 0 auto;
            height: 22px;
        }

        .plane-mini-box span {
            font-size: 9px;
            font-weight: bold;
            color: #f8fafc;
            pointer-events: none;
        }

        .no-planes-hint {
            color: #94a3b8;
            font-size: 9px;
            font-style: italic;
            width: 100%;
            text-align: center;
        }

        .control-inputs-grid {
            display: grid;
            grid-template-columns: 1fr 75px 65px;
            grid-template-rows: auto auto;
            gap: 2px;
            width: 100%;
            flex: 1;
        }

        input, select {
            width: 100%;
            height: 25px;
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid #64748b;
            background: #1e293b;
            color: #fff;
            font-size: 10px;
            outline: none;
        }

        button {
            border: none;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            height: 25px;
        }

        .btn-launch { background: #22c55e; }
        .btn-action { background: #475569; }
        .btn-action.active { background: #3b82f6; border: 1px solid #bfdbfe; }
        .btn-step { background: #f59e0b; color: #000; font-size: 13px; font-weight: 900; }
    </style>
</head>
<body>

    <div class="screen-container" id="screenContainer">
        <div class="sky-background" id="sky">
            <script>
                for(let i=0; i<25; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.width = (Math.random() * 2 + 1) + 'px';
                    star.style.height = star.style.width;
                    star.style.top = (Math.random() * 60) + '%';
                    star.style.left = (Math.random() * 100) + '%';
                    document.currentScript.parentNode.appendChild(star);
                }
            </script>
        </div>
        <div class="giant-moon" id="giantMoon"></div>
        <div class="mountains-background"></div>
        <div class="city-skyline"></div>
        <div class="ground-terrain"></div>
        <div class="planes-area" id="planesArea"></div>
    </div>

    <div class="control-panel">
        <div class="planes-mini-bar" id="planesMiniBar">
            <span class="no-planes-hint">لا توجد طيارات (أطلق من الأسفل)</span>
        </div>

        <div class="control-inputs-grid">
            <input type="text" id="usernameInput" placeholder="اسم المشاهد..." style="grid-column: 1 / 2;" />
            
            <select id="countrySelect" style="grid-column: 2 / 3;">
                <option value="jo">الأردن</option>
                <option value="eg">مصر</option>
                <option value="ae">الإمارات</option>
                <option value="sa">السعودية</option>
                <option value="iq">العراق</option>
                <option value="sy">سوريا</option>
                <option value="ps">فلسطين</option>
            </select>

            <button class="btn-launch" onclick="addSidePlane()" style="grid-column: 3 / 4;">✈️ إطلاق</button>

            <div style="grid-column: 1 / 4; display: grid; grid-template-columns: 1fr 1fr 0.5fr 0.5fr; gap: 2px;">
                <button id="boostActionBtn" class="btn-action active" onclick="setActionType('boost')">⚡ تسريع</button>
                <button id="attackActionBtn" class="btn-action" onclick="setActionType('attack')">💥 قصف</button>
                <button class="btn-step" onclick="stepAllPlanesHeight(-15)" title="رفع للأعلى">⬆️</button>
                <button class="btn-step" onclick="stepAllPlanesHeight(15)" title="إنزال للأسفل">⬇️</button>
            </div>
        </div>
    </div>

    <script>
        let activePlanes = [];
        let currentActionType = 'boost';
        let audioCtx = null;

        // تشغيل الموسيقى الخلفية فوراً وبصوت واضح وعالي (صوت قوي ومسموع)
        function forceStartBackgroundMusic() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
                let index = 0;
                
                setInterval(() => {
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle'; // نغمة ناعمة وواضحة
                    osc.frequency.setValueAtTime(notes[index], audioCtx.currentTime);
                    
                    // رفع مستوى الصوت (Gain) ليكون واضح وعالي تماماً
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.2);
                    
                    index = (index + 1) % notes.length;
                }, 2000);
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            forceStartBackgroundMusic();
        });

        ['click', 'touchstart', 'pointerdown'].forEach(evt => {
            window.addEventListener(evt, () => {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }, { once: true });
        });

        function setActionType(type) {
            currentActionType = type;
            document.getElementById('boostActionBtn').classList.toggle('active', type === 'boost');
            document.getElementById('attackActionBtn').classList.toggle('active', type === 'attack');
        }

        function playSound(type) {
            try {
                if (!audioCtx) return;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                if(type === 'spawn') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                } else if(type === 'boost') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                } else if(type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                } else if(type === 'explosion') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                }

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } catch(e) {}
        }

        let cycleTimer = 0;
        setInterval(() => {
            cycleTimer = (cycleTimer + 1) % 120;
            const moon = document.getElementById('giantMoon');
            if (cycleTimer >= 30 && cycleTimer <= 75) {
                moon.classList.add('visible');
            } else {
                moon.classList.remove('visible');
            }
        }, 1000);

        function updateMiniBar() {
            const bar = document.getElementById('planesMiniBar');
            bar.innerHTML = '';
            if (activePlanes.length === 0) {
                bar.innerHTML = '<span class="no-planes-hint">لا توجد طيارات (أطلق من الأسفل)</span>';
                return;
            }

            activePlanes.forEach((planeObj) => {
                const box = document.createElement('div');
                box.className = 'plane-mini-box';
                box.innerHTML = `<span>✈️ ${planeObj.name}</span>`;
                box.onclick = function() {
                    triggerPlaneAction(planeObj);
                };
                bar.appendChild(box);
            });
        }

        function triggerPlaneAction(planeObj) {
            const planeDiv = planeObj.element;
            if (!document.body.contains(planeDiv)) return;

            if (currentActionType === 'attack') {
                let rect = planeDiv.getBoundingClientRect();
                let gift = document.createElement('div');
                gift.className = 'falling-gift';
                gift.innerHTML = '🌹';
                gift.style.left = (rect.left + 30) + 'px';
                gift.style.top = '0px';
                gift.style.setProperty('--target-y', rect.top + 'px');
                
                document.body.appendChild(gift);
                setTimeout(() => gift.remove(), 450);

                document.getElementById('screenContainer').classList.add('shake');
                planeDiv.classList.add('shaking-plane');

                setTimeout(() => {
                    document.getElementById('screenContainer').classList.remove('shake');
                    planeDiv.classList.remove('shaking-plane');
                    planeObj.hits++;
                    if (planeObj.hits >= 10) {
                        planeDiv.classList.add('crashing');
                        playSound('explosion');
                        setTimeout(() => {
                            planeDiv.remove();
                            activePlanes = activePlanes.filter(p => p !== planeObj);
                            updateMiniBar();
                        }, 800);
                    } else {
                        planeObj.posX = Math.max(10, planeObj.posX - 18);
                        planeDiv.style.left = planeObj.posX + 'px';
                        planeDiv.classList.add('boost-glow');
                        playSound('hit');
                        setTimeout(() => { planeDiv.classList.remove('boost-glow'); }, 350);
                    }
                }, 300);

            } else {
                planeObj.posX += 25;
                if(planeObj.posX > window.innerWidth - 80) planeObj.posX = window.innerWidth - 80;
                planeDiv.style.left = planeObj.posX + 'px';
                planeDiv.classList.add('boost-glow');
                playSound('boost');
                setTimeout(() => { planeDiv.classList.remove('boost-glow'); }, 250);
            }
        }

        function stepAllPlanesHeight(delta) {
            let maxHeight = window.innerHeight * 0.7;
            activePlanes.forEach(planeObj => {
                planeObj.posY += delta;
                if(planeObj.posY < 10) planeObj.posY = 10;
                if(planeObj.posY > maxHeight) planeObj.posY = maxHeight;
                planeObj.element.style.top = planeObj.posY + 'px';
            });
            playSound('boost');
        }

        function addSidePlane() {
            const nameInput = document.getElementById('usernameInput');
            const countrySelect = document.getElementById('countrySelect');
            let name = nameInput.value.trim() || "مُشاهد";
            let countryCode = countrySelect.value;

            let flagHTML = '';
            if (countryCode === 'jo') {
                flagHTML = `
                    <svg viewBox="0 0 600 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <rect width="600" height="100" fill="#000000"/>
                        <rect y="100" width="600" height="100" fill="#ffffff"/>
                        <rect y="200" width="600" height="100" fill="#198754"/>
                        <polygon points="0,0 300,150 0,300" fill="#ce1126"/>
                        <polygon points="120,128 126,145 144,145 130,155 135,172 120,161 105,172 110,155 96,145 114,145" fill="#ffffff"/>
                    </svg>
                `;
            } else {
                let flagUrl = `https://flagcdn.com/w80/${countryCode}.png`;
                flagHTML = `<img src="${flagUrl}" alt="Flag" style="width:100%; height:100%; object-fit:cover;">`;
            }

            playSound('spawn');

            const planesArea = document.getElementById('planesArea');
            const planeDiv = document.createElement('div');
            planeDiv.className = 'side-plane';
            
            let posX = 15; 
            let posY = Math.random() * (window.innerHeight * 0.5) + 10; 

            planeDiv.style.left = posX + 'px';
            planeDiv.style.top = posY + 'px';

            planeDiv.innerHTML = `
                <svg class="plane-body-svg" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 40,70 C 40,25 140,20 295,45 C 320,50 335,70 335,100 C 335,135 320,155 295,160 C 140,185 40,175 40,130 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
                    <path d="M 295,50 C 315,55 325,72 325,100 C 325,128 315,145 295,150 Z" fill="#0284c7"/>
                    <path d="M 90,75 L 15,5 L 135,28 L 115,85 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
                    <path d="M 170,135 L 135,195 L 205,180 L 220,135 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
                </svg>
                <div class="plane-name-tag">${name}</div>
                <div class="plane-flag-container">${flagHTML}</div>
            `;

            const planeObj = {
                name: name,
                element: planeDiv,
                posX: posX,
                posY: posY,
                hits: 0
            };

            activePlanes.push(planeObj);
            planesArea.appendChild(planeDiv);
            updateMiniBar();

            nameInput.value = '';
        }
    </script>
</body>
</html>
