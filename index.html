<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 2px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: #FFD700; 
            min-height: 100vh; 
            font-family: 'Arial Black', sans-serif; 
            overflow: hidden; 
            touch-action: none; 
            position: relative;
        }

        .game-viewport {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            transform-origin: center center;
            will-change: transform;
            z-index: 2;
        }

        .top-panel-wrapper {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            width: 95vw;
            max-width: 450px;
            margin-bottom: 8px;
            gap: 6px;
        }

        .side-column {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 52px;
            flex-shrink: 0;
        }

        .mode-btn {
            width: 100%;
            height: 22px;
            background: #FFD700;
            border: 2px solid #b8860b;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000000;
            font-size: 0.75em;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 2px 0 #b8860b;
            transition: transform 0.1s, filter 0.1s;
        }
        .mode-btn:active { transform: scale(0.92); filter: brightness(0.85); }

        .scores-center-group {
            display: flex;
            gap: 6px;
            flex: 1;
            justify-content: center;
        }

        .custom-rect { 
            flex: 1; 
            height: 72px; 
            background: #1a252f; 
            border: 2.5px solid #FFD700; 
            border-radius: 8px; 
            box-shadow: 0 5px 0 #0f171e; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            transition: all 0.3s ease; 
        }
        .sum-text { font-size: 2.2em; font-weight: 900; color: #00ffcc; line-height: 1; font-family: 'Arial Black', sans-serif; }
        
        .flash-glow { animation: quickFlash 0.35s ease forwards; }
        @keyframes quickFlash {
            0% { background: #1a252f; }
            50% { background: #004d40; border-color: #fff; }
            100% { background: #1a252f; }
        }

        .winner-glow { border: 3px solid #fff !important; background: #e65100 !important; }

        .small-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 95vw; max-width: 450px; perspective: 1000px; padding-bottom: 5px; }
        .flip-card { height: 55px; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .flip-card.flipped { transform: rotateY(180deg); }
        
        .front { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border-radius: 8px; 
            background: #000000; 
            border: none; 
            box-shadow: 0 5px 0 #222222; 
            font-weight: 900; 
            font-size: 2em; 
            color: #FFD700; 
        }
        
        .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 8px; background: white; transform: rotateY(180deg); border: 1.5px solid #ddd; font-weight: 900; transition: all 0.3s ease; }
        
        .val-text { font-size: 2.1em; color: black; font-weight: 900; }
        
        .key-content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 0.95;
            transform: scaleY(0.85);
        }
        .key-text { 
            font-size: 1.65em; 
            color: #FFD700; 
            font-weight: 900; 
        }
        .key-icon { 
            font-size: 1.35em; 
            margin-bottom: -2px; 
        }
        
        /* التوهج مخصص حصرياً لمربع المفتاح (1000) فقط */
        .glowing-gold { 
            animation: superPulse 0.5s infinite alternate !important; 
            border: 3px solid #FFD700 !important; 
            background: #fffdf0 !important; 
        }
        @keyframes superPulse { 
            0% { transform: scale(1) rotateY(180deg); box-shadow: 0 0 6px gold, inset 0 0 10px rgba(255, 215, 0, 0.5); filter: brightness(1); } 
            100% { transform: scale(1.04) rotateY(180deg); box-shadow: 0 0 22px #fff, 0 0 35px gold, inset 0 0 20px rgba(255, 255, 255, 0.9); filter: brightness(1.25); } 
        }

        .row-glow-effect {
            border: 3px solid #00897b !important;
            background: #e0f2f1 !important;
        }
    </style>
</head>
<body onclick="makeFullScreen()">
    <div class="game-viewport" id="gameViewport">
        <div class="top-panel-wrapper">
            <div class="side-column">
                <div class="mode-btn" onclick="playSound('click'); setMode(3)">3</div>
                <div class="mode-btn" onclick="playSound('click'); setMode(4)">4</div>
                <div class="mode-btn" onclick="playSound('click'); setMode(5)">5</div>
            </div>

            <div class="scores-center-group">
                <div id="rect1" class="custom-rect"><div id="box1" class="sum-text">0</div></div>
                <div id="rect2" class="custom-rect"><div id="box2" class="sum-text">0</div></div>
            </div>

            <div class="side-column">
                <div class="mode-btn" onclick="playSound('click'); activateKeyMode()">🔑</div>
                <div class="mode-btn" onclick="playSound('click'); activateFreeMode()" style="font-size: 0.42em;">FREE</div>
                <div class="mode-btn" onclick="playSound('click'); resetAndShuffle()" style="font-size: 0.38em; font-weight: 900;">MIX</div>
            </div>
        </div>

        <div class="small-grid" id="grid"></div>
    </div>

    <script>
        let mode = 3, keyMode = false, isKeyFound = false, revealed = false, freeMode = false;
        let openOrder = [];
        let items = [];
        
        let scaleX = 1, scaleY = 1;
        let initialDistanceX = 0, initialDistanceY = 0;
        let startScaleX = 1, startScaleY = 1;
        
        const viewport = document.getElementById('gameViewport');

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                initialDistanceX = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
                initialDistanceY = Math.abs(e.touches[0].clientY - e.touches[1].clientY);
                startScaleX = scaleX;
                startScaleY = scaleY;
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let currentDistX = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
                let currentDistY = Math.abs(e.touches[0].clientY - e.touches[1].clientY);

                if (initialDistanceX > 10) {
                    scaleX = startScaleX * (currentDistX / initialDistanceX);
                    scaleX = Math.max(0.6, Math.min(scaleX, 1.5));
                }
                if (initialDistanceY > 10) {
                    scaleY = startScaleY * (currentDistY / initialDistanceY);
                    scaleY = Math.max(0.5, Math.min(scaleY, 1.4));
                }

                viewport.style.transform = `scale(${scaleX}, ${scaleY})`;
            }
        }, { passive: false });

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playModernChime(valNum) {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let pentatonic = [349.23, 392.00, 440.00, 523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 1046.50];
                let index = Math.floor(((valNum - 350) / (1000 - 350)) * (pentatonic.length - 1));
                if (index < 0) index = 0;
                if (index >= pentatonic.length) index = pentatonic.length - 1;
                
                let freq = pentatonic[index];
                let chord = [freq, freq * 1.25, freq * 1.5];

                chord.forEach((f, i) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = i === 0 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(f, now + (i * 0.03));
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.35, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (i * 0.03));
                    osc.stop(now + 0.45);
                });
            } catch (e) {
                console.log(e);
            }
        }

        function playSound(type, param = 0) {
            try {
                initAudio();

                if (type === 'click') {
                    let now = audioCtx.currentTime;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(850, now + 0.06);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'gentle-reveal') {
                    let valNum = parseInt(param);
                    if (isNaN(valNum)) valNum = 500;
                    playModernChime(valNum);
                } else if (type === 'finish-sound') {
                    let now = audioCtx.currentTime;
                    let notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.08));
                        gain.gain.setValueAtTime(0, now + (idx * 0.08));
                        gain.gain.linearRampToValueAtTime(0.4, now + (idx * 0.08) + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + (idx * 0.08) + 0.35);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + (idx * 0.08));
                        osc.stop(now + (idx * 0.08) + 0.35);
                    });
                } else if (type === 'page-flip') {
                    let now = audioCtx.currentTime;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.07);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } else if (type === 'ta-da') {
                    let now = audioCtx.currentTime;
                    let keyArpeggio = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                    keyArpeggio.forEach((freq, idx) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.09));
                        gain.gain.setValueAtTime(0, now + (idx * 0.09));
                        gain.gain.linearRampToValueAtTime(0.45, now + (idx * 0.09) + 0.04);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + (idx * 0.09) + 0.5);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + (idx * 0.09));
                        osc.stop(now + (idx * 0.09) + 0.5);
                    });
                }
            } catch (e) {
                console.log(e);
            }
        }

        let baseItems = [
            '1000', 
            950, 950, 
            900, 900, 
            850, 850, 850, 
            800, 800, 800, 
            750, 750, 750, 
            700, 700, 700, 
            650, 650, 650, 
            600, 600, 600, 
            550, 550, 550, 
            500, 500, 500, 
            350, 350, 350  
        ];

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            for (let t = 0; t < 5; t++) {
                currentIndex = array.length;
                while (currentIndex !== 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
            }
            return array;
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            items = shuffleArray([...baseItems]);
            for(let i=0; i<32; i++) {
                let val = items[i];
                let isKey = (val == 1000);
                grid.innerHTML += `
                    <div class="flip-card" data-index="${i}" onclick="handleCardClick(${i})">
                        <div class="front">${i+1}</div>
                        <div class="back ${isKey ? 'glowing-gold' : ''}">
                            ${isKey ? '<div class="key-content-box"><div class="key-icon">🔑</div><div class="key-text">1000</div></div>' : '<div class="val-text">'+val+'</div>'}
                        </div>
                    </div>`;
            }
        }

        function handleCardClick(index) {
            const cards = document.querySelectorAll('.flip-card');
            const el = cards[index];
            let val = items[index];

            if (keyMode) {
                if (isKeyFound) return;
                
                let rowIndex = Math.floor(index / 4);
                let startIndex = rowIndex * 4;

                let rowContainsKeys = false;
                for (let i = 0; i < 4; i++) {
                    let targetCard = cards[startIndex + i];
                    if (targetCard) {
                        let cardBack = targetCard.querySelector('.back');
                        if (cardBack.innerHTML.includes('1000')) {
                            rowContainsKeys = true;
                        }
                    }
                }

                for (let i = 0; i < 4; i++) {
                    let targetCard = cards[startIndex + i];
                    if (targetCard && !targetCard.classList.contains('flipped')) {
                        let cardVal = items[startIndex + i];
                        let isKeyItem = (cardVal == 1000);

                        setTimeout(() => {
                            targetCard.classList.add('flipped');
                            if (isKeyItem) {
                                isKeyFound = true;
                            } else {
                                playSound('gentle-reveal', cardVal);
                            }
                        }, i * 180);
                    }
                }

                if (rowContainsKeys) {
                    for (let i = 0; i < 4; i++) {
                        let targetCard = cards[startIndex + i];
                        if (targetCard) {
                            let cardBack = targetCard.querySelector('.back');
                            if (!cardBack.classList.contains('row-glow-effect')) {
                                cardBack.classList.add('row-glow-effect');
                            }
                        }
                    }
                }

                setTimeout(() => {
                    if (rowContainsKeys) {
                        playSound('ta-da');
                    }
                }, 300);

                return;
            }

            if (!el.classList.contains('flipped')) {
                el.classList.add('flipped');
                playSound('gentle-reveal', val);

                if (!freeMode && !revealed) {
                    let totalRequired = mode * 2;
                    let currentIndexCount = openOrder.length;
                    
                    openOrder.push({val: val});
                    updateSums();

                    let activeRectId = (currentIndexCount < mode) ? 'rect1' : 'rect2';
                    let activeRect = document.getElementById(activeRectId);
                    
                    activeRect.classList.remove('flash-glow');
                    void activeRect.offsetWidth; 
                    activeRect.classList.add('flash-glow');

                    if (openOrder.length === totalRequired) {
                        setTimeout(() => {
                            playSound('finish-sound'); 
                        }, 500);
                    }
                }
            }
        }

        function updateSums() {
            if (keyMode) {
                document.getElementById('box1').innerText = 0;
                document.getElementById('box2').innerText = 0;
                return;
            }

            let s1 = 0, s2 = 0;
            openOrder.forEach((item, index) => {
                let val = parseInt(item.val);
                if(index < mode) s1 += val;
                else if(index < (mode * 2)) s2 += val;
            });
            
            document.getElementById('box1').innerText = s1;
            document.getElementById('box2').innerText = s2;

            if (openOrder.length >= (mode * 2)) {
                let rect1 = document.getElementById('rect1');
                let rect2 = document.getElementById('rect2');
                
                rect1.classList.remove('winner-glow');
                rect2.classList.remove('winner-glow');

                (s1 > s2) ? rect1.classList.add('winner-glow') : (s2 > s1) ? rect2.classList.add('winner-glow') : null;
            }
        }

        function clearSums() {
            document.getElementById('box1').innerText = 0;
            document.getElementById('box2').innerText = 0;
            document.getElementById('rect1').classList.remove('winner-glow', 'flash-glow');
            document.getElementById('rect2').classList.remove('winner-glow', 'flash-glow');
            openOrder = [];
        }

        function resetAndShuffle() {
            revealed = false; isKeyFound = false;
            let cards = Array.from(document.querySelectorAll('.flip-card'));
            for(let card of cards) {
                card.classList.remove('flipped');
                let cardBack = card.querySelector('.back');
                if(cardBack) cardBack.classList.remove('row-glow-effect');
            }
            clearSums();
            renderGrid();
        }

        function activateKeyMode() { 
            keyMode = true; 
            isKeyFound = false; 
            freeMode = false;
            clearSums();
            let cards = Array.from(document.querySelectorAll('.flip-card'));
            for(let card of cards) {
                card.classList.remove('flipped');
                let cardBack = card.querySelector('.back');
                if(cardBack) cardBack.classList.remove('row-glow-effect');
            }
        }

        function setMode(m) { mode = m; keyMode = false; freeMode = false; resetAndShuffle(); }
        function activateFreeMode() { freeMode = true; keyMode = false; clearSums(); let cards = Array.from(document.querySelectorAll('.flip-card')); for(let card of cards) { card.classList.remove('flipped'); let cardBack = card.querySelector('.back'); if(cardBack) cardBack.classList.remove('row-glow-effect'); } }
        function makeFullScreen() { document.documentElement.requestFullscreen(); }
        
        renderGrid();
    </script>
</body>
</html>
